<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks · Focus on what matters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f9;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0%, transparent 60%),
               radial-gradient(900px 500px at 110% 10%, #fce7f3 0%, transparent 55%);
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --danger: #ef4444;
    --high: #ef4444;
    --med: #f59e0b;
    --low: #10b981;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 32px rgba(16,24,40,.08);
    --radius: 16px;
  }
  [data-theme="dark"] {
    --bg: #0b0d14;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #1e1b4b 0%, transparent 60%),
               radial-gradient(900px 500px at 110% 10%, #3b0a2a 0%, transparent 55%);
    --card: #141824;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: #262b3a;
    --accent: #818cf8;
    --accent-soft: #1e2140;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg-grad), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 16px;
    transition: background .3s, color .3s;
  }
  .app { width: 100%; max-width: 620px; }

  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
  .greeting { font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  h1 { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; display: grid; place-items: center;
    box-shadow: var(--shadow); transition: transform .15s;
  }
  .icon-btn:hover { transform: translateY(-1px); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

  .progress-card { padding: 20px 22px; margin-bottom: 16px; display: flex; align-items: center; gap: 18px; }
  .ring { width: 56px; height: 56px; flex-shrink: 0; }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .track { stroke: var(--border); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s ease; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .progress-text strong { font-size: 18px; display: block; }
  .progress-text span { font-size: 14px; color: var(--muted); }

  form.add { padding: 10px; display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  form.add input[type="text"] {
    flex: 1 1 240px; border: none; outline: none; background: transparent; font: inherit; font-size: 15px;
    color: var(--text); padding: 12px;
  }
  form.add input::placeholder { color: var(--muted); }
  .controls { display: flex; gap: 8px; align-items: center; }
  select, input[type="date"] {
    font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 10px; outline: none; cursor: pointer;
  }
  [data-theme="dark"] input[type="date"] { color-scheme: dark; }
  .btn-primary {
    background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px 18px;
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; transition: filter .15s, transform .1s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(.97); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters { display: inline-flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .filters button {
    border: none; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500;
    padding: 7px 14px; border-radius: 8px; cursor: pointer; transition: all .15s;
  }
  .filters button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .search {
    flex: 1; min-width: 160px; max-width: 220px; font: inherit; font-size: 13px; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; outline: none;
  }
  .search:focus, select:focus, input[type="date"]:focus { border-color: var(--accent); }

  ul.list { list-style: none; overflow: hidden; }
  li.task {
    display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--border);
    animation: slideIn .25s ease; transition: background .15s;
  }
  li.task:last-child { border-bottom: none; }
  li.task:hover { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
  li.task.removing { animation: slideOut .22s ease forwards; }
  li.task.dragging { opacity: .4; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @keyframes slideOut { to { opacity: 0; transform: translateX(24px); height: 0; padding: 0 18px; } }

  .check {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; cursor: pointer;
    display: grid; place-items: center; background: transparent; transition: all .2s;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { opacity: 0; transform: scale(.5); transition: all .2s; }
  .done .check { background: var(--accent); border-color: var(--accent); }
  .done .check svg { opacity: 1; transform: scale(1); }

  .body { flex: 1; min-width: 0; }
  .title { font-size: 15px; font-weight: 500; word-break: break-word; cursor: text; transition: color .2s; }
  .done .title { color: var(--muted); text-decoration: line-through; }
  .meta { display: flex; gap: 10px; margin-top: 5px; font-size: 12px; color: var(--muted); align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .p-high .dot { background: var(--high); } .p-medium .dot { background: var(--med); } .p-low .dot { background: var(--low); }
  .overdue { color: var(--danger); font-weight: 600; }
  .edit-input {
    width: 100%; font: inherit; font-size: 15px; font-weight: 500; color: var(--text); background: var(--bg);
    border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px; outline: none;
  }
  .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
  li.task:hover .actions, li.task:focus-within .actions { opacity: 1; }
  .actions button {
    width: 32px; height: 32px; border: none; background: transparent; border-radius: 8px; color: var(--muted);
    cursor: pointer; display: grid; place-items: center;
  }
  .actions button:hover { background: var(--bg); color: var(--text); }
  .actions .del:hover { color: var(--danger); }

  .empty { padding: 56px 24px; text-align: center; color: var(--muted); }
  .empty .emoji { font-size: 40px; margin-bottom: 10px; }
  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

  footer.bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); }
  .link-btn { border: none; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
  .link-btn:hover { color: var(--danger); }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
  kbd { font-family: inherit; font-size: 11px; background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 120px); background: var(--text); color: var(--card);
    padding: 12px 16px; border-radius: 12px; font-size: 14px; display: flex; gap: 14px; align-items: center;
    box-shadow: var(--shadow); transition: transform .3s ease; z-index: 10;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast button { background: none; border: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }

  @media (max-width: 520px) {
    body { padding: 32px 12px; }
    h1 { font-size: 26px; }
    .controls { width: 100%; }
    .controls select, .controls input { flex: 1; }
    .actions { opacity: 1; }
    .search { max-width: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="greeting" id="date"></div>
      <h1 id="greet">Good day</h1>
    </div>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
  </header>

  <div class="card progress-card">
    <svg class="ring" viewBox="0 0 56 56">
      <circle class="track" cx="28" cy="28" r="24"/>
      <circle class="bar" id="ringBar" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="150.8"/>
    </svg>
    <div class="progress-text">
      <strong id="progTitle">0% complete</strong>
      <span id="progSub">Add your first task to get started</span>
    </div>
  </div>

  <form class="card add" id="addForm" autocomplete="off">
    <input type="text" id="taskInput" placeholder="What needs to be done?" maxlength="200" required>
    <div class="controls">
      <select id="priority" aria-label="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="due" aria-label="Due date">
      <button class="btn-primary" type="submit">Add</button>
    </div>
  </form>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button data-f="all" class="active">All</button>
      <button data-f="active">Active</button>
      <button data-f="done">Completed</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search tasks…">
  </div>

  <div class="card">
    <ul class="list" id="list"></ul>
    <footer class="bar">
      <span id="count">0 tasks left</span>
      <button class="link-btn" id="clearDone">Clear completed</button>
    </footer>
  </div>

  <p class="hint">Double-click a task to edit · Drag to reorder · Press <kbd>/</kbd> to add</p>
</div>

<div class="toast" id="toast"><span id="toastMsg">Task deleted</span><button id="undoBtn">Undo</button></div>

<script>
(() => {
  const KEY = 'todo.tasks.v1', THEME = 'todo.theme';
  const $ = id => document.getElementById(id);
  const list = $('list'), input = $('taskInput');
  let tasks = load(), filter = 'all', query = '', lastDeleted = null, toastTimer, dragId = null;

  const icons = {
    sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
    edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
    cal: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
  };

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {} }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function fmtDue(d) {
    if (!d) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const due = new Date(d + 'T00:00:00');
    const diff = Math.round((due - today) / 864e5);
    let label = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday'
      : due.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return { label, overdue: diff < 0 };
  }

  function render() {
    const q = query.toLowerCase();
    const visible = tasks.filter(t =>
      (filter === 'all' || (filter === 'done' ? t.done : !t.done)) && t.text.toLowerCase().includes(q));

    if (!visible.length) {
      const msg = tasks.length === 0 ? ['📝', 'No tasks yet', 'Add something above to get going.']
        : query ? ['🔍', 'No matches', 'Try a different search.']
        : filter === 'done' ? ['🌱', 'Nothing completed yet', 'Tick off a task to see it here.']
        : ['🎉', 'All caught up', 'You have finished everything. Nice work.'];
      list.innerHTML = `<li class="empty"><div class="emoji">${msg[0]}</div><strong>${msg[1]}</strong>${msg[2]}</li>`;
    } else {
      list.innerHTML = visible.map(t => {
        const due = fmtDue(t.due);
        return `<li class="task ${t.done ? 'done' : ''}" data-id="${t.id}" draggable="true">
          <button class="check" data-act="toggle" aria-label="Toggle complete">${icons.check}</button>
          <div class="body">
            <div class="title" data-act="edit">${esc(t.text)}</div>
            <div class="meta">
              <span class="tag p-${t.priority}"><span class="dot"></span>${t.priority[0].toUpperCase() + t.priority.slice(1)}</span>
              ${due ? `<span class="tag ${due.overdue && !t.done ? 'overdue' : ''}">${icons.cal}${due.label}</span>` : ''}
            </div>
          </div>
          <div class="actions">
            <button data-act="edit" aria-label="Edit">${icons.edit}</button>
            <button class="del" data-act="delete" aria-label="Delete">${icons.trash}</button>
          </div>
        </li>`;
      }).join('');
    }

    const total = tasks.length, done = tasks.filter(t => t.done).length, left = total - done;
    const pct = total ? Math.round(done / total * 100) : 0;
    $('ringBar').style.strokeDashoffset = 150.8 * (1 - pct / 100);
    $('progTitle').textContent = `${pct}% complete`;
    $('progSub').textContent = total ? `${done} of ${total} tasks done` : 'Add your first task to get started';
    $('count').textContent = `${left} task${left === 1 ? '' : 's'} left`;
    $('clearDone').style.visibility = done ? 'visible' : 'hidden';
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: uid(), text, done: false, priority: $('priority').value, due: $('due').value || null, created: Date.now() });
    input.value = ''; $('due').value = '';
    save(); render(); input.focus();
  });

  list.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]'); if (!btn) return;
    const li = btn.closest('li.task'); const id = li.dataset.id;
    const act = btn.dataset.act;
    if (act === 'toggle') { const t = tasks.find(t => t.id === id); t.done = !t.done; save(); render(); }
    if (act === 'delete') remove(li, id);
    if (act === 'edit' && btn.tagName === 'BUTTON') startEdit(li, id);
  });
  list.addEventListener('dblclick', e => {
    const title = e.target.closest('.title'); if (title) startEdit(title.closest('li'), title.closest('li').dataset.id);
  });

  function remove(li, id) {
    const idx = tasks.findIndex(t => t.id === id);
    lastDeleted = { task: tasks[idx], idx };
    li.classList.add('removing');
    setTimeout(() => { tasks.splice(tasks.findIndex(t => t.id === id), 1); save(); render(); }, 200);
    showToast('Task deleted');
  }

  function startEdit(li, id) {
    const t = tasks.find(t => t.id === id), title = li.querySelector('.title');
    const inp = document.createElement('input');
    inp.className = 'edit-input'; inp.value = t.text; inp.maxLength = 200;
    title.replaceWith(inp); inp.focus(); inp.select();
    li.draggable = false;
    let finished = false;
    const finish = commit => {
      if (finished) return; finished = true;
      const v = inp.value.trim();
      if (commit && v) { t.text = v; save(); }
      render();
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
    inp.addEventListener('blur', () => finish(true));
  }

  function showToast(msg) {
    $('toastMsg').textContent = msg;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
  }
  $('undoBtn').addEventListener('click', () => {
    if (!lastDeleted) return;
    tasks.splice(Math.min(lastDeleted.idx, tasks.length), 0, lastDeleted.task);
    lastDeleted = null; save(); render();
    $('toast').classList.remove('show');
  });

  $('clearDone').addEventListener('click', () => { tasks = tasks.filter(t => !t.done); save(); render(); });

  $('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('active', x === b));
    render();
  });
  $('search').addEventListener('input', e => { query = e.target.value; render(); });

  // Drag to reorder
  list.addEventListener('dragstart', e => {
    const li = e.target.closest('li.task'); if (!li) return;
    dragId = li.dataset.id; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
  });
  list.addEventListener('dragend', e => { e.target.closest('li.task')?.classList.remove('dragging'); dragId = null; });
  list.addEventListener('dragover', e => {
    e.preventDefault();
    const over = e.target.closest('li.task'); if (!over || !dragId || over.dataset.id === dragId) return;
    const dragging = list.querySelector('.dragging');
    const rect = over.getBoundingClientRect();
    over.parentNode.insertBefore(dragging, e.clientY < rect.top + rect.height / 2 ? over : over.nextSibling);
  });
  list.addEventListener('drop', e => {
    e.preventDefault();
    const order = [...list.querySelectorAll('li.task')].map(li => li.dataset.id);
    const visibleSet = new Set(order);
    const reordered = order.map(id => tasks.find(t => t.id === id));
    let i = 0;
    tasks = tasks.map(t => visibleSet.has(t.id) ? reordered[i++] : t);
    save(); render();
  });

  // Theme
  function setTheme(th) {
    document.documentElement.dataset.theme = th;
    $('themeBtn').innerHTML = th === 'dark' ? icons.sun : icons.moon;
    try { localStorage.setItem(THEME, th); } catch {}
  }
  $('themeBtn').addEventListener('click', () =>
    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
  let saved; try { saved = localStorage.getItem(THEME); } catch {}
  setTheme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  // Header
  const now = new Date(), h = now.getHours();
  $('greet').textContent = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  $('date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  document.addEventListener('keydown', e => {
    if (e.key === '/' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) { e.preventDefault(); input.focus(); }
  });

  render();
})();
</script>
</body>
</html>
